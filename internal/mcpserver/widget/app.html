<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaltyBytes</title>
<style>
  :root {
    --paper: #faf6ee;
    --paper-deep: #f3ecdd;
    --card: #fffdf8;
    --ink: #22313a;
    --ink-soft: #66757c;
    --ink-faint: #98a4a8;
    --teal: #0e6b6b;
    --teal-deep: #0a5252;
    --salmon: #e8604c;
    --gold: #c9a227;
    --line: #e5dcc8;
    --ok: #2e7d5b;
    --ok-soft: #e3f1ea;
    --shadow: 0 1px 2px rgba(34,49,58,.06), 0 10px 28px rgba(34,49,58,.09);
    --shadow-lift: 0 2px 4px rgba(34,49,58,.08), 0 16px 40px rgba(34,49,58,.14);
    --serif: "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, "Times New Roman", serif;
    --sans: "Avenir Next", Avenir, "Segoe UI", Seravek, Corbel, system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --paper: #131c20;
    --paper-deep: #0e1518;
    --card: #1a252b;
    --ink: #ecf0ee;
    --ink-soft: #9fb0b0;
    --ink-faint: #6c7d80;
    --teal: #3fb0a5;
    --teal-deep: #2f8a82;
    --salmon: #f0765f;
    --gold: #d8b64a;
    --line: #2a373d;
    --ok: #5cc496;
    --ok-soft: #17342a;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 28px rgba(0,0,0,.35);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #root {
    background:
      radial-gradient(140% 90% at 100% 0%, var(--paper-deep) 0%, transparent 55%),
      var(--paper);
    border-radius: 14px;
    padding: 16px;
    min-height: 120px;
  }

  /* ---------- shared bits ---------- */
  .brandline {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px;
  }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 6px;
    background: var(--teal); color: #fff;
    font: 700 11px/22px var(--sans); text-align: center;
    letter-spacing: -0.3px; flex: none;
  }
  .brandline .kicker {
    font: 600 10.5px var(--sans);
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .brandline .spacer { flex: 1; }
  .backbtn {
    border: 1px solid var(--line); background: var(--card);
    color: var(--ink-soft); border-radius: 999px;
    font: 600 11.5px var(--sans); padding: 5px 12px; cursor: pointer;
  }
  .backbtn:hover { color: var(--teal); border-color: var(--teal); }
  .pinch { text-align: center; color: var(--ink-faint); font-size: 11px; letter-spacing: 0.5em; margin: 4px 0 10px; }

  /* ---------- card grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 12px;
  }
  .rcard {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease;
    display: flex; flex-direction: column;
    animation: rise .35s ease both;
  }
  .rcard:nth-child(2) { animation-delay: .04s; } .rcard:nth-child(3) { animation-delay: .08s; }
  .rcard:nth-child(4) { animation-delay: .12s; } .rcard:nth-child(5) { animation-delay: .16s; }
  .rcard:nth-child(6) { animation-delay: .20s; } .rcard:nth-child(7) { animation-delay: .24s; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .rcard:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
  .rcard .thumb { position: relative; aspect-ratio: 16/10; overflow: hidden; }
  .rcard .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font: 700 34px var(--serif);
    background:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 70% 60%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 45% 80%, rgba(255,255,255,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 85% 25%, rgba(255,255,255,.35) 50%, transparent 51%),
      linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
  }
  .rcard .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .rcard .src {
    font: 600 9.5px var(--sans);
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--salmon);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rcard h3 {
    font: 600 14.5px/1.3 var(--serif);
    letter-spacing: -0.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .rcard .meta { margin-top: auto; display: flex; gap: 8px; align-items: center; font: 500 11px var(--sans); color: var(--ink-soft); }
  .star { color: var(--gold); }

  /* ---------- recipe detail ---------- */
  .detail { animation: rise .3s ease both; }
  .hero { display: flex; gap: 14px; margin-bottom: 12px; }
  .hero .photo {
    flex: none; width: 128px; height: 128px;
    border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
  }
  .hero .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero .headings { min-width: 0; display: flex; flex-direction: column; gap: 7px; }
  .hero h2 { font: 650 21px/1.2 var(--serif); letter-spacing: -0.015em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 600 10.5px var(--sans); letter-spacing: 0.04em;
    color: var(--ink-soft);
    border: 1px solid var(--line); background: var(--card);
    padding: 3.5px 9px; border-radius: 999px;
  }
  .chip.accent { color: var(--teal); border-color: var(--teal); }
  .actions { display: flex; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
  .savebtn {
    border: none; cursor: pointer;
    background: var(--teal); color: #fff;
    font: 700 13px var(--sans);
    padding: 9px 18px; border-radius: 999px;
    transition: transform .12s ease, background .2s;
  }
  .savebtn:hover { background: var(--teal-deep); }
  .savebtn:active { transform: scale(.97); }
  .savebtn[disabled] { opacity: .6; cursor: default; }
  .savebtn.saved { background: var(--ok); animation: pop .3s ease; }
  @keyframes pop { 40% { transform: scale(1.07); } }
  .linkbtn {
    background: none; border: none; cursor: pointer;
    color: var(--ink-soft); font: 600 12px var(--sans);
    text-decoration: underline; text-underline-offset: 3px;
    padding: 9px 4px;
  }
  .linkbtn:hover { color: var(--teal); }

  .cols { display: grid; grid-template-columns: minmax(180px, 5fr) 7fr; gap: 18px; }
  @media (max-width: 560px) {
    .cols { grid-template-columns: 1fr; }
    .hero .photo { width: 92px; height: 92px; }
  }
  .sect-label {
    font: 700 10.5px var(--sans);
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--salmon);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px; margin-bottom: 9px;
  }
  .ing { list-style: none; }
  .ing li {
    display: flex; gap: 9px; align-items: baseline;
    padding: 4.5px 0; font-size: 13px; line-height: 1.45;
    cursor: pointer;
  }
  .ing .box {
    flex: none; width: 13px; height: 13px;
    border: 1.5px solid var(--ink-faint);
    border-radius: 4px 5px 4px 5px;
    position: relative; top: 1.5px;
    transition: all .15s;
  }
  .ing li.done .box { background: var(--teal); border-color: var(--teal); }
  .ing li.done .txt { color: var(--ink-faint); text-decoration: line-through; }
  .ing .qty { color: var(--teal); font-weight: 650; white-space: nowrap; }
  .steps { list-style: none; counter-reset: step; }
  .steps li {
    counter-increment: step;
    display: flex; gap: 12px;
    padding: 7px 0; font-size: 13.5px; line-height: 1.55;
  }
  .steps li::before {
    content: counter(step);
    flex: none;
    font: 700 19px/1 var(--serif);
    color: var(--salmon);
    min-width: 20px; text-align: right;
    opacity: .85;
  }

  /* ---------- states ---------- */
  .note {
    text-align: center; color: var(--ink-soft);
    font: 500 13px var(--sans); padding: 24px 12px;
  }
  .skeleton { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
  .skeleton .sk {
    height: 160px; border-radius: 12px;
    background: linear-gradient(100deg, var(--paper-deep) 40%, var(--card) 50%, var(--paper-deep) 60%);
    background-size: 200% 100%;
    animation: shimmer 1.2s linear infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .toast {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    font: 600 12.5px var(--sans);
    padding: 9px 16px; border-radius: 999px;
    box-shadow: var(--shadow-lift);
    animation: rise .25s ease;
    max-width: 90%; text-align: center;
  }
  .savedbadge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--ok-soft); color: var(--ok);
    font: 700 12px var(--sans);
    padding: 7px 14px; border-radius: 999px;
  }
  .multirow {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
    cursor: pointer; box-shadow: var(--shadow);
    transition: transform .15s ease;
  }
  .multirow:hover { transform: translateX(3px); }
  .multirow .n { font: 700 16px var(--serif); color: var(--salmon); min-width: 18px; text-align: right; }
  .multirow .t { font: 600 13.5px var(--serif); }
  .multirow .d { font: 400 11.5px var(--sans); color: var(--ink-soft); }
</style>
</head>
<body>
<div id="root"><div class="note">Setting the table&hellip;</div></div>
<script src="https://api.saltybytes.ai/mcp-widget.js"></script>
</body>
</html>
